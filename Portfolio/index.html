      <defs>
        <linearGradient id="sw1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#7fd7ff" stop-opacity=".00"/>
          <stop offset="45%" stop-color="#9fe4ff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#2b7fc4" stop-opacity=".00"/>

        <linearGradient id="sw2" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"  stop-color="#0d4d86" stop-opacity=".0"/>
          <stop offset="50%" stop-color="#6fc9f5" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#0d4d86" stop-opacity=".0"/>
        </linearGradient>
        <filter id="blr"><feGaussianBlur stdDeviation="18"/></filter>
      </defs>
      <path d="M-100,760 C280,700 420,300 780,300 C1140,300 1300,690 1750,600 L1750,900 L-100,900 Z"
            fill="url(#sw1)" filter="url(#blr)"/>
      <path d="M-100,840 C300,820 520,470 900,470 C1280,470 1420,780 1750,720 L1750,900 L-100,900 Z"
            fill="url(#sw2)" filter="url(#blr)"/>
      <path d="M-100,700 C300,660 500,240 820,250" stroke="#bfeaff" stroke-opacity=".35"
            stroke-width="2" fill="none" filter="url(#blr)"/>
    </svg>
    <div class="wp-vignette"></div>
    <div class="wp-brand">
      <div class="wp-logo">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="wp-brandtext">
        <div class="wp-w7">Windows<span>7</span></div>

    </div>

  <!-- desktop icons injected by JS -->

  <!-- rubber-band selection -->
